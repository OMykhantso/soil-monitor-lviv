# Render Blueprint (корінь репозиторію). Код проєкту лежить у папці soil-monitor/.
# Dashboard → New → Blueprint → оберіть цей репозиторій → Apply
databases:
  - name: soil-db
    databaseName: soil_monitoring
    user: soil
    plan: free            # безкоштовна БД Render діє 30 днів

services:
  - type: web
    name: soil-monitor
    runtime: docker
    plan: free            # free-інстанс засинає після ~15 хв без запитів
    dockerfilePath: ./soil-monitor/Dockerfile
    dockerContext: ./soil-monitor
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: soil-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@soil.local
      - key: ADMIN_PASSWORD
        sync: false       # Render попросить ввести під час створення Blueprint
      # AI-ключі (LLM_PROVIDER, LLM_MODEL, ANTHROPIC_API_KEY / OPENAI_API_KEY) додаються пізніше
      # у Dashboard → Environment. Без них — резервний відбір, позначений в інтерфейсі «без LLM».
      - key: STRATEGY_FALLBACK
        value: deterministic
